{% extends "base.html" %}

{% block title %}Add Worker - AutoCare{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-lg border-0">
        <div class="card-header bg-dark text-white text-center">
          <h5 class="mb-0"><i class="bi bi-person-plus-fill me-2"></i>Add Worker</h5>
        </div>
        <div class="card-body p-4">
          <form method="post">
            <div class="mb-3">
              <label class="form-label fw-bold"><i class="bi bi-person-fill me-1"></i>Name</label>
              <input type="text" name="name" class="form-control" placeholder="Enter worker's full name" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold"><i class="bi bi-award-fill me-1"></i>Experience (years)</label>
              <input type="number" name="experience_years" class="form-control" min="0" placeholder="e.g. 3" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold"><i class="bi bi-wrench-adjustable-circle-fill me-1"></i>Skills</label>
              <input type="text" name="skills" class="form-control" placeholder="e.g. Mechanic, Electrician" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold"><i class="bi bi-telephone-fill me-1"></i>Phone</label>
              <input type="text" name="phone" class="form-control" placeholder="Enter phone number" required>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-success">
                <i class="bi bi-check-circle-fill me-1"></i>Add Worker
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
