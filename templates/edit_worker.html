{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6">
    <div class="card shadow-lg border-0 rounded-4">
      <div class="card-header bg-dark text-white text-center fw-bold py-3">
        ✏️ Edit Worker
      </div>
      <div class="card-body p-4">
        <form method="POST" action="{{ url_for('edit_worker', worker_id=worker.id) }}">
          <div class="mb-3">
            <label for="name" class="form-label fw-semibold">Name</label>
            <input type="text" class="form-control" id="name" name="name" 
                   value="{{ worker.name }}" placeholder="Enter worker name" required>
          </div>
          <div class="mb-3">
            <label for="experience_years" class="form-label fw-semibold">Experience (Years)</label>
            <input type="number" class="form-control" id="experience_years" name="experience_years" 
                   value="{{ worker.experience_years }}" min="0" required>
          </div>
          <div class="mb-3">
            <label for="skills" class="form-label fw-semibold">Skills</label>
            <input type="text" class="form-control" id="skills" name="skills" 
                   value="{{ worker.skills }}" placeholder="e.g. Mechanic, Electrician">
          </div>
          <div class="mb-3">
            <label for="phone" class="form-label fw-semibold">Phone</label>
            <input type="text" class="form-control" id="phone" name="phone" 
                   value="{{ worker.phone }}" placeholder="Enter phone number">
          </div>
          <div class="d-flex justify-content-between">
            <button type="submit" class="btn btn-success px-4">💾 Update</button>
            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary px-4">❌ Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
